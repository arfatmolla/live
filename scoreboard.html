<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Score Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            overflow: hidden;
        }
        .scoreboard-wrapper {
            display: flex;
            flex-direction: column;
            width: 850px;
            box-shadow: 0px -4px 20px rgba(0,0,0,0.6);
            border-radius: 12px 12px 0 0;
            overflow: hidden;
        }
        /* মেইন স্কোর বার */
        .scoreboard-container {
            display: flex;
            background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
            color: white;
            border-bottom: 3px solid #ffcc00;
        }
        .team-section {
            background-color: #d32f2f;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            font-size: 26px;
            font-weight: bold;
            text-transform: uppercase;
            justify-content: center;
            min-width: 100px;
        }
        .score-section {
            padding: 12px 25px;
            display: flex;
            align-items: baseline;
            flex-grow: 1;
        }
        .main-score {
            font-size: 40px;
            font-weight: bold;
            color: #ffcc00;
        }
        .wickets {
            font-size: 26px;
            color: #ffffff;
        }
        .overs-section {
            font-size: 20px;
            margin-left: 15px;
            color: #cccccc;
        }
        /* ব্যাটার ও বোলার ইনফো বার */
        .players-bar {
            display: flex;
            background-color: rgba(17, 17, 17, 0.95);
            color: white;
            padding: 8px 15px;
            font-size: 16px;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #00e676;
        }
        .player-item {
            display: flex;
            gap: 8px;
        }
        .player-name {
            color: #00e676;
            font-weight: bold;
        }
        .status-box {
            font-size: 14px;
            color: #ffeb3b;
        }
    </style>
</head>
<body>

    <div class="scoreboard-wrapper">
        <!-- ব্যাটার ও বোলারের ছোট বার -->
        <div class="players-bar">
            <div class="player-item">
                <span>Batter 1:</span> <span id="batter-1" class="player-name">Loading...</span>
            </div>
            <div class="player-item">
                <span>Batter 2:</span> <span id="batter-2" class="player-name">Loading...</span>
            </div>
            <div class="status-box" id="targetText">🟡 Connecting...</div>
        </div>

        <!-- মেইন স্কোর বার -->
        <div class="scoreboard-container">
            <div class="team-section" id="disp-team">LIVE</div>
            <div class="score-section">
                <div class="main-score" id="disp-score">0<span class="wickets">/0</span></div>
                <div class="overs-section">Overs: <span id="disp-overs">0.0</span></div>
            </div>
        </div>
    </div>

    <script>
        // URL থেকে অটোমেটিক ম্যাচ আইডি বা কি (Key) ধরে নেওয়ার ফাংশন
        function getMatchKey() {
            const urlParams = new URLSearchParams(window.location.search);
            // যদি লিংকে ?key=1272 দেওয়া থাকে সেটা নেবে, না থাকলে ডিফল্ট 1272 ধরবে
            return urlParams.get('key') || '1272'; 
        }

        async function fetchAutoScore() {
            const googleProxy = "https://script.google.com/macros/s/AKfycbxG0yRfILCDUcCr_v5PjRAud3IuuyX5efLkaHpy5uxbvFLhEf4SYlQmdYCiajJdZ0mg/exec"; 
            
            // ডায়নামিক ম্যাচ আইডি যুক্ত করা
            const matchKey = getMatchKey();
            const apiUrl = `https://api-v1.com/v10/sC4.php?key=${matchKey}`;
            
            const fetchUrl = `${googleProxy}?url=${encodeURIComponent(apiUrl)}`;
            
            try {
                let response = await fetch(fetchUrl);
                let textData = await response.text();
                let data = JSON.parse(textData);
                let currentInnings = data[data.length - 1]; 
                
                if(currentInnings) {
                    // ১. মেইন স্কোর ও ওভার আপডেট
                    if(currentInnings.d) {
                        let scoreParts = currentInnings.d.split('(');
                        let runsAndWickets = scoreParts[0].split('/'); 
                        let runs = runsAndWickets[0];
                        let wickets = runsAndWickets[1] === "10" ? "All Out" : runsAndWickets[1];
                        
                        let totalBalls = parseInt(scoreParts[1]);
                        let overs = Math.floor(totalBalls / 6) + "." + (totalBalls % 6);
                        
                        document.getElementById('disp-score').innerHTML = `${runs}<span class="wickets">/${wickets}</span>`;
                        document.getElementById('disp-overs').innerText = overs;
                    }

                    // ২. ব্যাটারদের রান ও বল আপডেট
                    if(currentInnings.a && currentInnings.a.length >= 2) {
                        let b1Parts = currentInnings.a[0].split('.'); 
                        let b2Parts = currentInnings.a[1].split('.'); 
                        
                        document.getElementById('batter-1').innerText = `${b1Parts[0]} (${b1Parts[1]}r, ${b1Parts[2]}b)`;
                        document.getElementById('batter-2').innerText = `${b2Parts[0]} (${b2Parts[1]}r, ${b2Parts[2]}b)`;
                    }

                    document.getElementById('targetText').innerText = `🔴 LIVE (Match: ${matchKey})`;
                }
            } catch (error) {
                console.log("Error:", error);
                document.getElementById('targetText').innerText = "⚠️ RECONNECTING...";
            }
        }

        setInterval(fetchAutoScore, 3000);
        fetchAutoScore(); 
    </script>
</body>
</html>
