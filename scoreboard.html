<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Score Overlay - Fixed Match</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            overflow: hidden;
        }
        .scoreboard-wrapper {
            display: flex;
            flex-direction: column;
            width: 1200px;
            box-shadow: 0px -10px 35px rgba(0,0,0,0.9);
            border-radius: 16px 16px 0 0;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.25);
            margin-bottom: 25px;
        }
        .info-bar {
            display: flex;
            background-color: #0b0f19;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00e676;
            font-weight: bold;
        }
        .match-status {
            color: #38bdf8;
        }
        .crr-box {
            color: #ffeb3b;
        }
        .crr-box span {
            color: #00e676;
        }
        .scoreboard-container {
            display: flex;
            background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
            color: white;
            border-bottom: 6px solid #ffcc00;
        }
        .team-section {
            background-color: #d32f2f;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            justify-content: center;
            min-width: 250px;
            text-align: center;
            letter-spacing: 1px;
        }
        .score-section {
            padding: 15px 35px;
            display: flex;
            align-items: baseline;
            flex-grow: 1;
            justify-content: space-between;
        }
        .score-left {
            display: flex;
            align-items: baseline;
        }
        .main-score {
            font-size: 64px;
            font-weight: bold;
            color: #ffcc00;
            line-height: 1;
        }
        .wickets {
            font-size: 44px;
            color: #ffffff;
        }
        .overs-section {
            font-size: 30px;
            margin-left: 40px;
            color: #cbd5e1;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="scoreboard-wrapper">
        <div class="info-bar">
            <div class="match-status" id="match-status">Searching BAN vs PAK...</div>
            <div class="crr-box">CRR: <span id="crr-val">0.00</span></div>
        </div>

        <div class="scoreboard-container">
            <div class="team-section" id="team-name">BAN vs PAK</div>
            <div class="score-section">
                <div class="score-left">
                    <div class="main-score" id="disp-score">0<span class="wickets">/0</span></div>
                    <div class="overs-section">Overs: <span id="disp-overs">0.0</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "035ce33c-b814-401a-b852-5c0f5dc05300";
        
        // এখানে নির্দিষ্ট করে দুটি টিমই বলে দেওয়া হলো যাতে অন্য কোনো ম্যাচ চলে না আসে
        const team1 = "bangladesh";
        const team2 = "pakistan";

        async function fetchLiveScore() {
            const url = `https://api.cricapi.com/v1/currentMatches?apikey=${apiKey}&offset=0`;

            try {
                let response = await fetch(url);
                let data = await response.json();

                if (data.status === "success" && data.data && data.data.length > 0) {
                    // এমন ম্যাচ খুঁজবে যার নামের মধ্যে বাংলাদেশ এবং পাকিস্তান দুটোই উপস্থিত আছে
                    let targetMatch = data.data.find(m => {
                        let mName = m.name.toLowerCase();
                        return mName.includes(team1) && mName.includes(team2);
                    });

                    // যদি নির্দিষ্ট ম্যাচটি লাইভ লিস্টে পাওয়া যায়
                    if (targetMatch) {
                        document.getElementById('match-status').innerText = targetMatch.status || "Live Match";

                        if (targetMatch.teamInfo && targetMatch.teamInfo.length >= 2) {
                            document.getElementById('team-name').innerText = targetMatch.teamInfo[0].shortname || targetMatch.teams[0];
                        } else if (targetMatch.teams && targetMatch.teams.length > 0) {
                            document.getElementById('team-name').innerText = targetMatch.teams[0];
                        }

                        if (targetMatch.score && targetMatch.score.length > 0) {
                            let currentScoreObj = targetMatch.score[0];
                            let runs = currentScoreObj.r || 0;
                            let wickets = currentScoreObj.w || 0;
                            let overs = currentScoreObj.o || 0.0;

                            document.getElementById('disp-score').innerHTML = `${runs}<span class="wickets">/${wickets}</span>`;
                            document.getElementById('disp-overs').innerText = overs;

                            let totalBalls = 0;
                            let oversStr = overs.toString();
                            if (oversStr.includes('.')) {
                                let parts = oversStr.split('.');
                                totalBalls = (parseInt(parts[0]) * 6) + parseInt(parts[1] || 0);
                            } else {
                                totalBalls = parseInt(oversStr) * 6;
                            }

                            let crr = totalBalls > 0 ? ((runs / totalBalls) * 6).toFixed(2) : "0.00";
                            document.getElementById('crr-val').innerText = crr;
                        } else {
                            document.getElementById('disp-score').innerHTML = `0<span class="wickets">/0</span>`;
                            document.getElementById('disp-overs').innerText = "0.0";
                        }
                    } else {
                        // যদি বাংলাদেশ বনাম পাকিস্তান ম্যাচটি লাইভ লিস্টে খুঁজে না পাওয়া যায়
                        document.getElementById('match-status').innerText = "BAN vs PAK Match Not Live Right Now";
                        document.getElementById('team-name').innerText = "BAN vs PAK";
                    }
                } else {
                    document.getElementById('match-status').innerText = "No Live Match Found";
                }
            } catch (error) {
                console.log("API Fetch Error:", error);
                document.getElementById('match-status').innerText = "Connection Error";
            }
        }

        setInterval(fetchLiveScore, 10000);
        fetchLiveScore();
    </script>
</body>
</html>
