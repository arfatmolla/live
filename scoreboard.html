<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Score Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            overflow: hidden;
        }
        .scoreboard-wrapper {
            display: flex;
            flex-direction: column;
            width: 900px;
            box-shadow: 0px -5px 25px rgba(0,0,0,0.8);
            border-radius: 12px 12px 0 0;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .info-bar {
            display: flex;
            background-color: #0b0f19;
            color: white;
            padding: 8px 20px;
            font-size: 15px;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00e676;
            font-weight: bold;
        }
        .info-bar span {
            color: #00e676;
        }
        .scoreboard-container {
            display: flex;
            background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
            color: white;
            border-bottom: 4px solid #ffcc00;
        }
        .team-section {
            background-color: #d32f2f;
            padding: 14px 25px;
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            justify-content: center;
            min-width: 140px;
            letter-spacing: 1px;
        }
        .score-section {
            padding: 10px 25px;
            display: flex;
            align-items: baseline;
            flex-grow: 1;
            justify-content: space-between;
        }
        .score-left {
            display: flex;
            align-items: baseline;
        }
        .main-score {
            font-size: 42px;
            font-weight: bold;
            color: #ffcc00;
            line-height: 1;
        }
        .wickets {
            font-size: 28px;
            color: #ffffff;
        }
        .overs-section {
            font-size: 20px;
            margin-left: 20px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="scoreboard-wrapper">
        <div class="info-bar">
            <div>Team: <span id="disp-team">LIVE</span></div>
            <div>CRR: <span id="crr-val">0.00</span></div>
        </div>

        <div class="scoreboard-container">
            <div class="team-section" id="disp-team-badge">TEAM</div>
            <div class="score-section">
                <div class="score-left">
                    <div class="main-score" id="disp-score">0<span class="wickets">/0</span></div>
                    <div class="overs-section">Overs: <span id="disp-overs">0.0</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getMatchKey() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('key') || '14MU'; 
        }

        async function fetchAutoScore() {
            const matchKey = getMatchKey();
            const apiUrl = `https://api-v1.com/v10/sC4.php?key=${matchKey}`;
            
            try {
                let response = await fetch(apiUrl);
                let textData = await response.text();
                let data = JSON.parse(textData);
                
                // নতুন অ্যারে স্ট্রাকচার হ্যান্ডেল করার জন্য প্রথম ইনডেক্স চেক করা
                let matchInfo = Array.isArray(data) ? data[0] : data;
                
                if(matchInfo) {
                    // ১. টিম কোড সেট করা (যেমন: "c": "DF")
                    if(matchInfo.c) {
                        document.getElementById('disp-team').innerText = matchInfo.c;
                        document.getElementById('disp-team-badge').innerText = matchInfo.c;
                    }

                    // ২. রান ও ওভার পার্স করা (যেমন: "d": "97/6(60" বা অনুরূপ ফরম্যাট)
                    if(matchInfo.d) {
                        let scoreParts = matchInfo.d.split('(');
                        let runWicketStr = scoreParts[0]; // যেমন "97/6"
                        let oversStr = scoreParts[1] ? scoreParts.replace(')', '') : "0";

                        let rw = runWicketStr.split('/');
                        let runs = parseInt(rw[0]) || 0;
                        let wickets = rw[1] || "0";

                        document.getElementById('disp-score').innerHTML = `${runs}<span class="wickets">/${wickets}</span>`;
                        
                        // যদি ওভার ব্র্যাকেটের ভেতর থাকে বা আলাদাভাবে থাকে
                        let overs = scoreParts[1] ? scoreParts[1].replace(')', '') : "0.0";
                        document.getElementById('disp-overs').innerText = overs;

                        // ৩. রান রেট (CRR) ক্যালকুলেশন
                        let totalBalls = 0;
                        if(overs.includes('.')) {
                            let oParts = overs.split('.');
                            totalBalls = (parseInt(oParts[0]) * 6) + parseInt(oParts[1] || 0);
                        } else {
                            totalBalls = parseInt(overs) * 6;
                        }

                        let crr = totalBalls > 0 ? ((runs / totalBalls) * 6).toFixed(2) : "0.00";
                        document.getElementById('crr-val').innerText = crr;
                    }
                }
            } catch (error) {
                console.log("Fetch Error:", error);
            }
        }

        setInterval(fetchAutoScore, 3000);
        fetchAutoScore(); 
    </script>
</body>
</html>
