<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Score Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            overflow: hidden;
        }
        .scoreboard-wrapper {
            display: flex;
            flex-direction: column;
            width: 900px;
            box-shadow: 0px -5px 25px rgba(0,0,0,0.8);
            border-radius: 12px 12px 0 0;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        /* টপ ইনফো বার: ব্যাটার ও CRR */
        .info-bar {
            display: flex;
            background-color: #0b0f19;
            color: white;
            padding: 8px 18px;
            font-size: 15px;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00e676;
        }
        .player-info span {
            color: #00e676;
            font-weight: bold;
        }
        .crr-box {
            color: #ffeb3b;
            font-weight: bold;
        }
        /* মেইন স্কোর বার */
        .scoreboard-container {
            display: flex;
            background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
            color: white;
            border-bottom: 4px solid #ffcc00;
        }
        .team-section {
            background-color: #d32f2f;
            padding: 12px 25px;
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            justify-content: center;
            min-width: 150px;
            letter-spacing: 1px;
            text-align: center;
        }
        .score-section {
            padding: 10px 25px;
            display: flex;
            align-items: baseline;
            flex-grow: 1;
            justify-content: space-between;
        }
        .score-left {
            display: flex;
            align-items: baseline;
        }
        .main-score {
            font-size: 42px;
            font-weight: bold;
            color: #ffcc00;
            line-height: 1;
        }
        .wickets {
            font-size: 28px;
            color: #ffffff;
        }
        .overs-section {
            font-size: 20px;
            margin-left: 20px;
            color: #cbd5e1;
        }
        .match-status {
            font-size: 14px;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="scoreboard-wrapper">
        <!-- ইনফো বার -->
        <div class="info-bar">
            <div class="player-info">
                <div>Batter: <span id="striker-name">Loading...</span></div>
            </div>
            <div class="crr-box">CRR: <span id="crr-val">0.00</span></div>
        </div>

        <!-- মেইন স্কোর বার -->
        <div class="scoreboard-container">
            <div class="team-section" id="disp-team">TEAM</div>
            <div class="score-section">
                <div class="score-left">
                    <div class="main-score" id="disp-score">0<span class="wickets">/0</span></div>
                    <div class="overs-section">Overs: <span id="disp-overs">0.0</span></div>
                </div>
                <div class="match-status" id="match-status">Live Match</div>
            </div>
        </div>
    </div>

    <script>
        function getMatchKey() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('key') || '14MU'; 
        }

        async function fetchAutoScore() {
            const googleProxy = "https://script.google.com/macros/s/AKfycbxG0yRfILCDUcCr_v5PjRAud3IuuyX5efLkaHpy5uxbvFLhEf4SYlQmdYCiajJdZ0mg/exec"; 
            const matchKey = getMatchKey();
            
            // API এন্ডপয়েন্টসমূহ: স্কোর, প্লেয়ার এবং টিম লিস্ট
            const scoreApiUrl = `https://api-v1.com/v10/sC4.php?key=${matchKey}`;
            const playersApiUrl = `https://api-v1.com/v10/pC4.php?key=${matchKey}`;
            const teamsApiUrl = `https://api-v1.com/v10/tC4.php?key=${matchKey}`; // টিম লিস্টের এন্ডপয়েন্ট
            
            try {
                let [scoreRes, playersRes, teamsRes] = await Promise.all([
                    fetch(`${googleProxy}?url=${encodeURIComponent(scoreApiUrl)}`),
                    fetch(`${googleProxy}?url=${encodeURIComponent(playersApiUrl)}`).catch(() => null),
                    fetch(`${googleProxy}?url=${encodeURIComponent(teamsApiUrl)}`).catch(() => null)
                ]);

                let scoreText = await scoreRes.text();
                let scoreData = JSON.parse(scoreText);
                let matchInfo = Array.isArray(scoreData) ? scoreData[0] : scoreData;

                // প্লেয়ার ম্যাপ তৈরি
                let playersMap = {};
                if (playersRes) {
                    let pData = JSON.parse(await playersRes.text());
                    let pList = pData.p || (Array.isArray(pData) ? pData : []);
                    pList.forEach(p => { if(p.f_key && p.n) playersMap[p.f_key] = p.n; });
                }

                // টিম ম্যাপ তৈরি (যেমন: "DF" -> "Ajman")
                let teamsMap = {};
                if (teamsRes) {
                    let tData = JSON.parse(await teamsRes.text());
                    let tList = tData.t || (Array.isArray(tData) ? tData : []);
                    tList.forEach(t => { if(t.f_key && t.n) teamsMap[t.f_key] = t.n; });
                }

                if(matchInfo) {
                    // ১. রান ও উইকেট
                    let scoreString = matchInfo.j || matchInfo.ts || "0/0";
                    if(scoreString.includes('(')) scoreString = scoreString.split('(')[0];
                    let runsAndWickets = scoreString.split('/');
                    let runs = parseInt(runsAndWickets[0]) || 0;
                    let wickets = runsAndWickets[1] || "0";
                    
                    document.getElementById('disp-score').innerHTML = `${runs}<span class="wickets">/${wickets}</span>`;

                    // ২. ওভার ও রান রেট
                    let overs = "0.0", totalBalls = 0;
                    if(matchInfo.j && matchInfo.j.includes('(')) {
                        overs = matchInfo.j.split('(')[1].replace(')', '') || "0.0";
                    } else if(matchInfo.q) {
                        overs = matchInfo.q.replace('*', '');
                    } else if(matchInfo.L) {
                        overs = matchInfo.L;
                    }

                    document.getElementById('disp-overs').innerText = overs;
                    if(overs.includes('.')) {
                        let oParts = overs.split('.');
                        totalBalls = (parseInt(oParts[0]) * 6) + parseInt(oParts[1] || 0);
                    } else {
                        totalBalls = parseInt(overs) * 6;
                    }

                    let crr = totalBalls > 0 ? ((runs / totalBalls) * 6).toFixed(2) : "0.00";
                    document.getElementById('crr-val').innerText = crr;

                    // ৩. টিমের নাম সেট করা (যেমন: Ajman)
                    let battingTeamKey = matchInfo.g || matchInfo.bt;
                    if(battingTeamKey && teamsMap[battingTeamKey]) {
                        document.getElementById('disp-team').innerText = teamsMap[battingTeamKey];
                    } else if(battingTeamKey) {
                        document.getElementById('disp-team').innerText = battingTeamKey;
                    }

                    // ৪. স্ট্রাইকার ব্যাটার নাম
                    let strikerId = matchInfo.partnership ? matchInfo.partnership.strikerId : (matchInfo.b || matchInfo.a);
                    if(strikerId && playersMap[strikerId]) {
                        document.getElementById('striker-name').innerText = playersMap[strikerId];
                    } else {
                        document.getElementById('striker-name').innerText = "Live Batting";
                    }

                    // ৫. ম্যাচ স্ট্যাটাস
                    if(matchInfo.B) {
                        document.getElementById('match-status').innerText = matchInfo.B;
                    }
                }
            } catch (error) {
                console.log("Error:", error);
            }
        }

        setInterval(fetchAutoScore, 3000);
        fetchAutoScore(); 
    </script>
</body>
</html>
