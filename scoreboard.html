<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Score Overlay (Direct)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            overflow: hidden;
        }
        .scoreboard-wrapper {
            display: flex;
            flex-direction: column;
            width: 850px;
            box-shadow: 0px -5px 25px rgba(0,0,0,0.8);
            border-radius: 12px 12px 0 0;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .info-bar {
            display: flex;
            background-color: #0b0f19;
            color: white;
            padding: 8px 18px;
            font-size: 15px;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00e676;
        }
        .info-bar span {
            color: #00e676;
            font-weight: bold;
        }
        .crr-box {
            color: #ffeb3b;
            font-weight: bold;
        }
        .scoreboard-container {
            display: flex;
            background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
            color: white;
            border-bottom: 4px solid #ffcc00;
        }
        .team-section {
            background-color: #d32f2f;
            padding: 12px 25px;
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            justify-content: center;
            min-width: 120px;
            letter-spacing: 1px;
        }
        .score-section {
            padding: 10px 25px;
            display: flex;
            align-items: baseline;
            flex-grow: 1;
            justify-content: space-between;
        }
        .score-left {
            display: flex;
            align-items: baseline;
        }
        .main-score {
            font-size: 42px;
            font-weight: bold;
            color: #ffcc00;
            line-height: 1;
        }
        .wickets {
            font-size: 28px;
            color: #ffffff;
        }
        .overs-section {
            font-size: 20px;
            margin-left: 20px;
            color: #cbd5e1;
        }
        .match-status {
            font-size: 14px;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="scoreboard-wrapper">
        <div class="info-bar">
            <div>Status: <span id="match-status">Connecting...</span></div>
            <div class="crr-box">CRR: <span id="crr-val">0.00</span></div>
        </div>

        <div class="scoreboard-container">
            <div class="team-section" id="disp-team">LIVE</div>
            <div class="score-section">
                <div class="score-left">
                    <div class="main-score" id="disp-score">0<span class="wickets">/0</span></div>
                    <div class="overs-section">Overs: <span id="disp-overs">0.0</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getMatchKey() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('key') || '14MU'; 
        }

        async function fetchAutoScore() {
            const matchKey = getMatchKey();
            // কোনো প্রক্সি ছাড়াই সরাসরি API লিংক
            const apiUrl = `https://api-v1.com/v10/sC4.php?key=${matchKey}`;
            
            try {
                let response = await fetch(apiUrl);
                let textData = await response.text();
                let data = JSON.parse(textData);
                
                let matchInfo = Array.isArray(data) ? data[0] : data;
                
                if(matchInfo) {
                    let scoreString = matchInfo.j || matchInfo.ts || "0/0";
                    if(scoreString.includes('(')) scoreString = scoreString.split('(')[0];
                    let runsAndWickets = scoreString.split('/');
                    let runs = parseInt(runsAndWickets[0]) || 0;
                    let wickets = runsAndWickets[1] || "0";
                    
                    document.getElementById('disp-score').innerHTML = `${runs}<span class="wickets">/${wickets}</span>`;

                    let overs = "0.0", totalBalls = 0;
                    if(matchInfo.j && matchInfo.j.includes('(')) {
                        overs = matchInfo.j.split('(')[1].replace(')', '') || "0.0";
                    } else if(matchInfo.q) {
                        overs = matchInfo.q.replace('*', '');
                    } else if(matchInfo.L) {
                        overs = matchInfo.L;
                    }

                    document.getElementById('disp-overs').innerText = overs;
                    if(overs.includes('.')) {
                        let oParts = overs.split('.');
                        totalBalls = (parseInt(oParts[0]) * 6) + parseInt(oParts[1] || 0);
                    } else {
                        totalBalls = parseInt(overs) * 6;
                    }

                    let crr = totalBalls > 0 ? ((runs / totalBalls) * 6).toFixed(2) : "0.00";
                    document.getElementById('crr-val').innerText = crr;

                    if(matchInfo.g) document.getElementById('disp-team').innerText = matchInfo.g;
                    if(matchInfo.B) document.getElementById('match-status').innerText = matchInfo.B;
                }
            } catch (error) {
                console.log("Direct Fetch Error:", error);
                document.getElementById('match-status').innerText = "CORS Blocked (Need Proxy)";
            }
        }

        setInterval(fetchAutoScore, 3000);
        fetchAutoScore(); 
    </script>
</body>
</html>
