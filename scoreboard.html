<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Score Overlay - Full Stats</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            overflow: hidden;
        }
        .scoreboard-wrapper {
            display: flex;
            flex-direction: column;
            width: 1250px;
            box-shadow: 0px -10px 35px rgba(0,0,0,0.9);
            border-radius: 16px 16px 0 0;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.25);
            margin-bottom: 25px;
        }
        /* টপ ইনফো বার: ব্যাটার, বোলার ও পার্টনারশিপ */
        .info-bar {
            display: flex;
            background-color: #0b0f19;
            color: white;
            padding: 10px 25px;
            font-size: 15px;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00e676;
            font-weight: bold;
        }
        .stats-group {
            display: flex;
            gap: 25px;
        }
        .stats-item span {
            color: #00e676;
        }
        .crr-rrr {
            color: #ffeb3b;
        }
        /* মেইন স্কোর বার */
        .scoreboard-container {
            display: flex;
            background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
            color: white;
            border-bottom: 6px solid #ffcc00;
        }
        .team-section {
            background-color: #d32f2f;
            padding: 18px 35px;
            display: flex;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            text-transform: uppercase;
            justify-content: center;
            min-width: 180px;
            letter-spacing: 2px;
        }
        .score-section {
            padding: 12px 35px;
            display: flex;
            align-items: baseline;
            flex-grow: 1;
            justify-content: space-between;
        }
        .score-left {
            display: flex;
            align-items: baseline;
        }
        .main-score {
            font-size: 58px;
            font-weight: bold;
            color: #ffcc00;
            line-height: 1;
        }
        .wickets {
            font-size: 40px;
            color: #ffffff;
        }
        .overs-section {
            font-size: 26px;
            margin-left: 30px;
            color: #cbd5e1;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="scoreboard-wrapper">
        <!-- ইনফো বার: ব্যাটার, বোলার, পার্টনারশিপ ও রান রেট -->
        <div class="info-bar">
            <div class="stats-group">
                <div class="stats-item">Batters: <span id="batter-stats">Syncing...</span></div>
                <div class="stats-item">Bowler: <span id="bowler-stats">Syncing...</span></div>
            </div>
            <div class="crr-rrr">CRR: <span id="crr-val">0.00</span> | RRR: <span id="rrr-val">0.00</span></div>
        </div>

        <!-- মেইন স্কোর বার -->
        <div class="scoreboard-container">
            <div class="team-section" id="disp-team">TEAM</div>
            <div class="score-section">
                <div class="score-left">
                    <div class="main-score" id="disp-score">0<span class="wickets">/0</span></div>
                    <div class="overs-section">Overs: <span id="disp-overs">0.0</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getMatchKey() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('key') || '14MU'; 
        }

        async function fetchAutoScore() {
            const matchKey = getMatchKey();
            const apiUrl = `https://api-v1.com/v10/sC4.php?key=${matchKey}`;
            const playersApiUrl = `https://api-v1.com/v10/pC4.php?key=${matchKey}`;
            
            try {
                let [scoreRes, playersRes] = await Promise.all([
                    fetch(apiUrl).catch(() => null),
                    fetch(playersApiUrl).catch(() => null)
                ]);

                let matchInfo = null;
                if(scoreRes) {
                    let scoreData = await scoreRes.json();
                    matchInfo = Array.isArray(scoreData) ? scoreData[0] : scoreData;
                }

                // প্লেয়ারদের আসল নাম ম্যাপ করার জন্য
                let playersMap = {};
                if(playersRes) {
                    let pData = await playersRes.json();
                    let pList = pData.p || (Array.isArray(pData) ? pData : []);
                    pList.forEach(p => {
                        if(p.f_key && p.n) {
                            playersMap[p.f_key] = p.n;
                        }
                    });
                }
                
                if(matchInfo) {
                    // ১. টিম কোড
                    if(matchInfo.c) {
                        document.getElementById('disp-team').innerText = matchInfo.c;
                    }

                    // ২. রান, উইকেট ও ওভার পার্সিং
                    if(matchInfo.d) {
                        let scoreParts = matchInfo.d.split('(');
                        let runWicketStr = scoreParts[0]; 
                        let rw = runWicketStr.split('/');
                        let runs = parseInt(rw[0]) || 0;
                        let wickets = rw[1] || "0";

                        document.getElementById('disp-score').innerHTML = `${runs}<span class="wickets">/${wickets}</span>`;
                        
                        let overs = scoreParts[1] ? scoreParts[1].replace(')', '') : "0.0";
                        document.getElementById('disp-overs').innerText = overs;

                        // CRR ও RRR ক্যালকুলেশন
                        let totalBalls = 0;
                        if(overs.includes('.')) {
                            let oParts = overs.split('.');
                            totalBalls = (parseInt(oParts[0]) * 6) + parseInt(oParts[1] || 0);
                        } else {
                            totalBalls = parseInt(overs) * 6;
                        }

                        let crr = totalBalls > 0 ? ((runs / totalBalls) * 6).toFixed(2) : "0.00";
                        document.getElementById('crr-val').innerText = crr;

                        // ধরে নিচ্ছি ম্যাচটি সাধারণত ৬০ ওভারের (যেরকম ডেটায় দেখা গেছে) বা ২০ ওভারের
                        let maxBalls = 360; // ৬০ ওভার হলে ৩৬০ বল, বা ২০ ওভার হলে ১২০ বল। এখানে ডেটার ওপর ভিত্তি করে অ্যাডজাস্ট করা যাবে।
                        let ballsRemaining = maxBalls - totalBalls;
                        let target = runs + 50; // ডেমো বা অনুমানমূলক টার্গেট যদি API-তে না থাকে
                        let runsNeeded = target - runs;
                        let rrr = (ballsRemaining > 0 && runsNeeded > 0) ? ((runsNeeded / ballsRemaining) * 6).toFixed(2) : "0.00";
                        document.getElementById('rrr-val').innerText = rrr;
                    }

                    // ৩. ব্যাটার ও বোলারের ডেটা অ্যারে হ্যান্ডলিং (`a` এবং `b` অ্যারে থেকে)
                    if(matchInfo.a && Array.isArray(matchInfo.a) && matchInfo.a.length > 0) {
                        let battersText = [];
                        matchInfo.a.slice(0, 2).forEach(item => {
                            let parts = item.split('.');
                            let pKey = parts[0];
                            let pName = playersMap[pKey] || pKey;
                            let pRuns = parts[1] || "0";
                            let pBalls = parts[2] || "0";
                            battersText.push(`${pName} (${pRuns}* / ${pBalls}b)`);
                        });
                        document.getElementById('batter-stats').innerText = battersText.join(" | ");
                    }

                    if(matchInfo.b && Array.isArray(matchInfo.b) && matchInfo.b.length > 0) {
                        let bowlerItem = matchInfo.b[0].split('.');
                        let bKey = bowlerItem[0];
                        let bName = playersMap[bKey] || bKey;
                        let bOvers = bowlerItem[1] || "0";
                        let bRuns = bowlerItem[2] || "0";
                        let bWickets = bowlerItem[3] || "0";
                        document.getElementById('bowler-stats').innerText = `${bName} (${bOvers}-${bRuns}-${bWickets})`;
                    }
                }
            } catch (error) {
                console.log("Full Stats Fetch Error:", error);
            }
        }

        setInterval(fetchAutoScore, 3000);
        fetchAutoScore(); 
    </script>
</body>
</html>
