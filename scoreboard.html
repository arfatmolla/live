<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Score Overlay</title>
    <style>
        /* OBS & CameraFi Overlay Professional CSS */
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* ব্যাকগ্রাউন্ড ট্রান্সপারেন্ট */
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            overflow: hidden;
        }
        .scoreboard-container {
            display: flex;
            background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
            color: white;
            border-radius: 12px 12px 0 0;
            box-shadow: 0px -4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
            width: 800px;
            border-bottom: 4px solid #ffcc00;
        }
        .team-section {
            background-color: #d32f2f;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            min-width: 120px;
            justify-content: center;
        }
        .score-section {
            padding: 15px 30px;
            display: flex;
            align-items: baseline;
            flex-grow: 1;
        }
        .main-score {
            font-size: 45px;
            font-weight: bold;
            color: #ffcc00;
        }
        .wickets {
            font-size: 30px;
            color: #ffffff;
        }
        .overs-section {
            font-size: 22px;
            margin-left: 20px;
            color: #aaaaaa;
        }
        .info-section {
            background-color: #111;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            font-size: 16px;
            min-width: 200px;
        }
        .target-text {
            color: #00e676;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="scoreboard-container">
        <!-- Team Name -->
        <div class="team-section" id="disp-team">LIVE</div>
        
        <!-- Score & Overs -->
        <div class="score-section">
            <div class="main-score" id="disp-score">0<span class="wickets">/0</span></div>
            <div class="overs-section">Overs: <span id="disp-overs">0.0</span></div>
        </div>
        
        <!-- Live Status Info -->
        <div class="info-section">
            <div class="target-text" id="targetText">🟡 Connecting...</div>
        </div>
    </div>

    <script>
        async function fetchAutoScore() {
            // আপনার দেওয়া গুগল প্রক্সি লিংক (H টাকে ছোট হাতের করে দেওয়া হয়েছে লিংকের নিয়মে)
            const googleProxy = "https://script.google.com/macros/s/AKfycbxG0yRfILCDUcCr_v5PjRAud3IuuyX5efLkaHpy5uxbvFLhEf4SYlQmdYCiajJdZ0mg/exec"; 
            
            // আপনার বের করা API লিংক
            const apiUrl = "https://api-v1.com/v10/sC4.php?key=1272";
            
            const fetchUrl = `${googleProxy}?url=${encodeURIComponent(apiUrl)}`;
            
            try {
                let response = await fetch(fetchUrl);
                let textData = await response.text();
                
                let data = JSON.parse(textData);
                let currentInnings = data[data.length - 1]; 
                
                if(currentInnings && currentInnings.d) {
                    let scoreParts = currentInnings.d.split('(');
                    let runsAndWickets = scoreParts[0].split('/'); 
                    
                    let runs = runsAndWickets[0];
                    let wickets = runsAndWickets[1] === "10" ? "All Out" : runsAndWickets[1];
                    
                    let totalBalls = parseInt(scoreParts[1]);
                    let overs = Math.floor(totalBalls / 6) + "." + (totalBalls % 6);
                    
                    // HTML-এ ডেটা আপডেট করা
                    document.getElementById('disp-score').innerHTML = `${runs}<span class="wickets">/${wickets}</span>`;
                    document.getElementById('disp-overs').innerText = overs;
                    document.getElementById('targetText').innerText = "🔴 Live Data Synced";
                }
            } catch (error) {
                console.log("Error Fetching API:", error);
                document.getElementById('targetText').innerText = "⚠️ Reconnecting...";
            }
        }

        // প্রতি ৩ সেকেন্ড পর পর ডেটা অটোমেটিক রিফ্রেশ হবে
        setInterval(fetchAutoScore, 3000);
        fetchAutoScore(); 
    </script>
</body>
</html>
