<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Score Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            overflow: hidden;
        }
        .scoreboard-wrapper {
            display: flex;
            flex-direction: column;
            width: 850px;
            box-shadow: 0px -4px 20px rgba(0,0,0,0.6);
            border-radius: 12px 12px 0 0;
            overflow: hidden;
        }
        .scoreboard-container {
            display: flex;
            background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
            color: white;
            border-bottom: 3px solid #ffcc00;
        }
        .team-section {
            background-color: #d32f2f;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            font-size: 26px;
            font-weight: bold;
            text-transform: uppercase;
            justify-content: center;
            min-width: 100px;
        }
        .score-section {
            padding: 12px 25px;
            display: flex;
            align-items: baseline;
            flex-grow: 1;
        }
        .main-score {
            font-size: 40px;
            font-weight: bold;
            color: #ffcc00;
        }
        .wickets {
            font-size: 26px;
            color: #ffffff;
        }
        .overs-section {
            font-size: 20px;
            margin-left: 15px;
            color: #cccccc;
        }
        .players-bar {
            display: flex;
            background-color: rgba(17, 17, 17, 0.95);
            color: white;
            padding: 8px 15px;
            font-size: 16px;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #00e676;
        }
        .player-item {
            display: flex;
            gap: 8px;
        }
        .player-name {
            color: #00e676;
            font-weight: bold;
        }
        .status-box {
            font-size: 14px;
            color: #ffeb3b;
        }
    </style>
</head>
<body>

    <div class="scoreboard-wrapper">
        <!-- ইনফো বা স্ট্যাটাস বার -->
        <div class="players-bar">
            <div class="player-item">
                <span>Status:</span> <span id="match-status" class="player-name">Live Match</span>
            </div>
            <div class="status-box" id="targetText">🟡 Syncing...</div>
        </div>

        <!-- মেইন স্কোর বার -->
        <div class="scoreboard-container">
            <div class="team-section" id="disp-team">LIVE</div>
            <div class="score-section">
                <div class="main-score" id="disp-score">0<span class="wickets">/0</span></div>
                <div class="overs-section">Overs: <span id="disp-overs">0.0</span></div>
            </div>
        </div>
    </div>

    <script>
        function getMatchKey() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('key') || '14MU'; 
        }

        async function fetchAutoScore() {
            const googleProxy = "https://script.google.com/macros/s/AKfycbxG0yRfILCDUcCr_v5PjRAud3IuuyX5efLkaHpy5uxbvFLhEf4SYlQmdYCiajJdZ0mg/exec"; 
            const matchKey = getMatchKey();
            const apiUrl = `https://api-v1.com/v10/sC4.php?key=${matchKey}`;
            const fetchUrl = `${googleProxy}?url=${encodeURIComponent(apiUrl)}`;
            
            try {
                let response = await fetch(fetchUrl);
                let textData = await response.text();
                let data = JSON.parse(textData);
                
                // নতুন ডাটা স্ট্রাকচার অনুযায়ী মেইন অবজেক্ট হ্যান্ডেল করা
                let matchInfo = Array.isArray(data) ? data[0] : data;
                
                if(matchInfo) {
                    // ১. স্কোর ও ওভার পার্স করা (যেমন: "97/6(10.0")
                    if(matchInfo.j) {
                        let cleanScore = matchInfo.j.replace('(', ' ');
                        let parts = cleanScore.split(' ');
                        let runsWickets = parts[0].split('/');
                        
                        let runs = runsWickets[0] || "0";
                        let wickets = runsWickets[1] || "0";
                        let overs = parts[1] || "0.0";
                        
                        document.getElementById('disp-score').innerHTML = `${runs}<span class="wickets">/${wickets}</span>`;
                        document.getElementById('disp-overs').innerText = overs;
                    }

                    // ২. ম্যাচ স্ট্যাটাস বা ব্রেক দেখানো (যেমন: Innings Break)
                    if(matchInfo.B) {
                        document.getElementById('match-status').innerText = matchInfo.B;
                    }

                    document.getElementById('targetText').innerText = `🔴 LIVE (${matchKey})`;
                }
            } catch (error) {
                console.log("Error:", error);
                document.getElementById('targetText').innerText = "⚠️ RECONNECTING...";
            }
        }

        setInterval(fetchAutoScore, 3000);
        fetchAutoScore(); 
    </script>
</body>
</html>
