<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Score Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            overflow: hidden;
        }
        .scoreboard-wrapper {
            display: flex;
            flex-direction: column;
            width: 500px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.7);
            border-radius: 12px 12px 0 0;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .scoreboard-container {
            display: flex;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            border-bottom: 4px solid #ffcc00;
        }
        .team-section {
            background-color: #d32f2f;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            justify-content: center;
            min-width: 90px;
            letter-spacing: 1px;
        }
        .score-section {
            padding: 12px 25px;
            display: flex;
            align-items: baseline;
            flex-grow: 1;
            justify-content: space-between;
        }
        .score-left {
            display: flex;
            align-items: baseline;
        }
        .main-score {
            font-size: 44px;
            font-weight: bold;
            color: #ffcc00;
            line-height: 1;
        }
        .wickets {
            font-size: 30px;
            color: #ffffff;
        }
        .overs-section {
            font-size: 20px;
            margin-left: 20px;
            color: #00e676;
            font-weight: bold;
        }
        .live-tag {
            background: rgba(255, 0, 0, 0.8);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="scoreboard-wrapper">
        <div class="scoreboard-container">
            <div class="team-section">
                <span class="live-tag">LIVE</span>
            </div>
            <div class="score-section">
                <div class="score-left">
                    <div class="main-score" id="disp-score">0<span class="wickets">/0</span></div>
                    <div class="overs-section">Ov: <span id="disp-overs">0.0</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getMatchKey() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('key') || '14MU'; 
        }

        async function fetchAutoScore() {
            const googleProxy = "https://script.google.com/macros/s/AKfycbxG0yRfILCDUcCr_v5PjRAud3IuuyX5efLkaHpy5uxbvFLhEf4SYlQmdYCiajJdZ0mg/exec"; 
            const matchKey = getMatchKey();
            const apiUrl = `https://api-v1.com/v10/sC4.php?key=${matchKey}`;
            const fetchUrl = `${googleProxy}?url=${encodeURIComponent(apiUrl)}`;
            
            try {
                let response = await fetch(fetchUrl);
                let textData = await response.text();
                let data = JSON.parse(textData);
                
                let matchInfo = Array.isArray(data) ? data[0] : data;
                
                if(matchInfo) {
                    // রান ও উইকেট
                    let scoreString = matchInfo.j || matchInfo.ts || "0/0";
                    if(scoreString.includes('(')) {
                        scoreString = scoreString.split('(')[0];
                    }
                    let runsAndWickets = scoreString.split('/');
                    let runs = runsAndWickets[0] || "0";
                    let wickets = runsAndWickets[1] || "0";
                    
                    document.getElementById('disp-score').innerHTML = `${runs}<span class="wickets">/${wickets}</span>`;

                    // ওভার
                    let overs = "0.0";
                    if(matchInfo.j && matchInfo.j.includes('(')) {
                        let bracketPart = matchInfo.j.split('(')[1];
                        overs = bracketPart ? bracketPart.replace(')', '') : "0.0";
                    } else if(matchInfo.q) {
                        overs = matchInfo.q.replace('*', '');
                    } else if(matchInfo.L) {
                        overs = matchInfo.L;
                    }

                    document.getElementById('disp-overs').innerText = overs;
                }
            } catch (error) {
                console.log("Error:", error);
            }
        }

        setInterval(fetchAutoScore, 3000);
        fetchAutoScore(); 
    </script>
</body>
</html>
